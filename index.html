<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTech Academy - Alunos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-4">
    <h1 class="mb-4 text-center">DevTech Academy</h1>

    <!-- Formulário -->
    <div class="card mb-4 shadow-sm">
      <div class="card-header fw-bold">Cadastro de Alunos</div>
      <div class="card-body">
        <form id="form-aluno">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nome" class="form-label">Nome</label>
              <input type="text" id="nome" class="form-control">
            </div>
            <div class="col-md-2">
              <label for="idade" class="form-label">Idade</label>
              <input type="number" id="idade" class="form-control">
            </div>
            <div class="col-md-2">
              <label for="curso" class="form-label">Curso</label>
              <select id="curso" class="form-select">
                <option value="JavaScript">JavaScript</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="notaFinal" class="form-label">Nota Final</label>
              <input type="number" id="notaFinal" class="form-control" step="0.1" min="0" max="10">
            </div>
          </div>

          <div class="mt-3">
            <button type="button" id="btn-cadastrar" class="btn btn-primary">Cadastrar</button>
            <button type="button" id="btn-cancelar" class="btn btn-secondary">Cancelar edição</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header fw-bold">Alunos Cadastrados</div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Curso</th>
                <th>Nota Final</th>
                <th>Situação</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="corpo-tabela"></tbody>
          </table>
        </div>
      </div>
    </div>

      <!-- Relatórios -->
    <div class="card mt-4 shadow-sm">
      <div class="card-header fw-bold">Relatórios</div>
      <div class="card-body">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <button type="button" id="btn-aprovados" class="btn btn-success">Listar aprovados</button>
          <button type="button" id="btn-media-notas" class="btn btn-info">Média das notas</button>
          <button type="button" id="btn-media-idades" class="btn btn-info">Média das idades</button>
          <button type="button" id="btn-ordem-alfabetica" class="btn btn-outline-primary">Nomes em ordem alfabética</button>
          <button type="button" id="btn-por-curso" class="btn btn-outline-primary">Alunos por curso</button>
        </div>
        <div id="resultado" class="alert alert-secondary mb-0">Nenhum relatório gerado.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
